name: Release Draft

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build web app
        run: |
          cd frontend/
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          cd ..

      - name: Upload web folder
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend/dist

      - name: Upload web folder (Electron)
        uses: actions/upload-artifact@v4
        with:
          name: web-denshi
          path: frontend/dist

  build-server:
    needs: build-webapp
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            id: yourant-server-windows
            go_flags: -trimpath -ldflags="-s -w"

          - os: ubuntu-latest
            id: yourant-server-linux
            go_flags: -trimpath -ldflags="-s -w"

          - os: macos-latest
            id: yourant-server-darwin
            go_flags: -trimpath -ldflags="-s -w"
    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ⬇️
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download web folder artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Create binary destination folder (UNIX) 🗃️
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        run: mkdir -p binaries

      - name: Create binary destination folder (Windows) 🗃️
        if: matrix.os == 'windows-latest'
        run: mkdir -p binaries
        shell: bash

      - name: Build Windows Server 📦️
        if: matrix.id == 'yourant-server-windows'
        env:
          GOARCH: amd64
          GOOS: windows
          CGO_ENABLED: 0
        run: |
          go build -o binaries/yourant-server-windows-amd64.exe ${{ matrix.go_flags }} ./cmd/server
          cp binaries/yourant-server-windows-amd64.exe binaries/yourant-server.exe
        shell: bash

      - name: Build Linux Server 📦️
        if: matrix.id == 'yourant-server-linux'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o binaries/yourant-server-linux-amd64 ${{ matrix.go_flags }} ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o binaries/yourant-server-linux-arm64 ${{ matrix.go_flags }} ./cmd/server

      - name: Build macOS Server 📦️
        if: matrix.id == 'yourant-server-darwin'
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o binaries/yourant-server-darwin-amd64 ${{ matrix.go_flags }} ./cmd/server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o binaries/yourant-server-darwin-arm64 ${{ matrix.go_flags }} ./cmd/server

      - name: Tar the binaries (UNIX) 🗃️
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        run: |
          tar -cf binaries-${{ matrix.id }}.tar -C binaries .

      - name: Zip the binaries (Windows) 🗃️
        if: matrix.os == 'windows-latest'
        run: |
          7z a "binaries-${{ matrix.id }}.zip" ./binaries/*

      - name: Upload binary folder (UNIX) 📤
        uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        with:
          name: go-${{ matrix.id }}
          path: binaries-${{ matrix.id }}.tar

      - name: Upload binary folder (Windows) 📤
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: go-${{ matrix.id }}
          path: binaries-${{ matrix.id }}.zip

  build-electron:
    needs: build-server
    uses: ./.github/workflows/electron-build.yml

  release:
    runs-on: ubuntu-latest
    needs: [ build-server, build-electron ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download electron artifacts 📥
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: ./artifacts
          merge-multiple: true

      - name: Determine version from tag name 🔎
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            IS_PRERELEASE="false"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/(.*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            IS_PRERELEASE="false"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            BASE_VER="1.0.0"
            if [ -f "./frontend/package.json" ]; then
              BASE_VER=$(node -p "try { require('./frontend/package.json').version } catch(e) { '1.0.0' }")
            fi
            VERSION="${BASE_VER}-preview.${GITHUB_RUN_NUMBER}"
            IS_PRERELEASE="true"
          else
            VERSION="1.0.0-ci.${GITHUB_RUN_NUMBER}"
            IS_PRERELEASE="true"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "Version is $VERSION (prerelease: $IS_PRERELEASE)"

      - name: Download server binaries 📥
        uses: actions/download-artifact@v4
        with:
          pattern: go-*
          path: ./artifacts
          merge-multiple: true

      - name: Extract - Rename - Archive server binaries 📂
        run: |
          mkdir -p ./release_assets
          if [ -f ./artifacts/binaries-yourant-server-darwin.tar ]; then
            tar -xf ./artifacts/binaries-yourant-server-darwin.tar -C ./release_assets
            tar -czf ./yourant-server-${{ env.VERSION }}_MacOS_x86_64.tar.gz -C ./release_assets yourant-server-darwin-amd64
            tar -czf ./yourant-server-${{ env.VERSION }}_MacOS_arm64.tar.gz -C ./release_assets yourant-server-darwin-arm64
          fi

          if [ -f ./artifacts/binaries-yourant-server-linux.tar ]; then
            tar -xf ./artifacts/binaries-yourant-server-linux.tar -C ./release_assets
            tar -czf ./yourant-server-${{ env.VERSION }}_Linux_x86_64.tar.gz -C ./release_assets yourant-server-linux-amd64
            tar -czf ./yourant-server-${{ env.VERSION }}_Linux_arm64.tar.gz -C ./release_assets yourant-server-linux-arm64
          fi

          if [ -f ./artifacts/binaries-yourant-server-windows.zip ]; then
            7z x ./artifacts/binaries-yourant-server-windows.zip -o./release_assets/
            7z a ./yourant-server-${{ env.VERSION }}_Windows_x86_64.zip ./release_assets/yourant-server*
          fi
        shell: bash

      - name: Collect desktop artifacts 📝🗃️
        run: |
          mkdir -p ./release_desktop
          find ./artifacts -name "yourant-desktop-*" -exec cp {} ./release_desktop/ \; 2>/dev/null || true
          find ./artifacts -name "Yourant*" -exec cp {} ./release_desktop/ \; 2>/dev/null || true
          find ./artifacts -name "*.exe" -exec cp {} ./release_desktop/ \; 2>/dev/null || true
          find ./artifacts -name "*.AppImage" -exec cp {} ./release_desktop/ \; 2>/dev/null || true
          find ./artifacts -name "*.dmg" -exec cp {} ./release_desktop/ \; 2>/dev/null || true
          find ./artifacts -name "*.zip" -exec cp {} ./release_desktop/ \; 2>/dev/null || true
          find ./artifacts -name "*.yml" -exec cp {} ./release_desktop/ \; 2>/dev/null || true

      - name: Create release draft 🚀
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ./release_desktop/*
            ./yourant-server-*.tar.gz
            ./yourant-server-*.zip
            ./release_assets/yourant-server*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: Yourant v${{ env.VERSION }}
          draft: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          body: |
            ## Yourant v${{ env.VERSION }}

            Automated release build triggered by commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            ### Included Distribution Artifacts
            - **Desktop Executables**: Standalone installers with embedded Go backend sidecar and Vite frontend.
            - **Standalone Server**: Pure Go headless server binaries and archives.
            - **Frontend SPA**: Built Vite static distribution.
