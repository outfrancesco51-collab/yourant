name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag_name: ${{ steps.calc.outputs.tag_name }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate release version
        id: calc
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TAG_NAME="v${VERSION}"
            IS_PRERELEASE="false"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/(.*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TAG_NAME="${VERSION}"
            IS_PRERELEASE="false"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            BASE_VER="1.0.0"
            if [ -f "./frontend/package.json" ]; then
              BASE_VER=$(node -p "try { require('./frontend/package.json').version } catch(e) { '1.0.0' }")
            elif [ -f "./electron/package.json" ]; then
              BASE_VER=$(node -p "try { require('./electron/package.json').version } catch(e) { '1.0.0' }")
            fi
            VERSION="${BASE_VER}-preview.${GITHUB_RUN_NUMBER}"
            TAG_NAME="v${VERSION}"
            IS_PRERELEASE="true"
          else
            VERSION="1.0.0-ci.${GITHUB_RUN_NUMBER}"
            TAG_NAME="v${VERSION}"
            IS_PRERELEASE="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Computed Version: ${VERSION}"
          echo "Computed Tag Name: ${TAG_NAME}"
          echo "Is Prerelease: ${IS_PRERELEASE}"

  build-frontend:
    name: Build Frontend
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vite Frontend
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: Package frontend distribution archives
        run: |
          tar -czf "yourant-frontend-${{ needs.version.outputs.version }}.tar.gz" -C frontend/dist .
          zip -r "yourant-frontend-${{ needs.version.outputs.version }}.zip" frontend/dist

      - name: Upload frontend distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: frontend-archives
          path: |
            yourant-frontend-${{ needs.version.outputs.version }}.tar.gz
            yourant-frontend-${{ needs.version.outputs.version }}.zip

  build-backend:
    name: Build Go Backend
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Compile Go backend binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          mkdir -p archives

          echo "Building Windows amd64 binary..."
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/yourant-server.exe ./cmd/server
          cp bin/yourant-server.exe bin/yourant-server-windows-amd64.exe

          echo "Building Linux amd64 binary..."
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/yourant-server-linux-amd64 ./cmd/server

          echo "Building Linux arm64 binary..."
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/yourant-server-linux-arm64 ./cmd/server

          echo "Building macOS amd64 binary..."
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/yourant-server-darwin-amd64 ./cmd/server

          echo "Building macOS arm64 binary..."
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/yourant-server-darwin-arm64 ./cmd/server

          # Mark Unix binaries executable
          chmod +x bin/yourant-server-linux-* bin/yourant-server-darwin-*

          # Create standalone release archives
          VER="${{ needs.version.outputs.version }}"
          zip "archives/yourant-server-${VER}_Windows_x86_64.zip" -j bin/yourant-server.exe bin/yourant-server-windows-amd64.exe
          tar -czf "archives/yourant-server-${VER}_Linux_x86_64.tar.gz" -C bin yourant-server-linux-amd64
          tar -czf "archives/yourant-server-${VER}_Linux_arm64.tar.gz" -C bin yourant-server-linux-arm64
          tar -czf "archives/yourant-server-${VER}_MacOS_x86_64.tar.gz" -C bin yourant-server-darwin-amd64
          tar -czf "archives/yourant-server-${VER}_MacOS_arm64.tar.gz" -C bin yourant-server-darwin-arm64

      - name: Upload backend binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: bin/*
          if-no-files-found: error

      - name: Upload backend archives artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-archives
          path: archives/*
          if-no-files-found: error

  build-electron:
    name: Build Electron Desktop (${{ matrix.platform }})
    needs: [version, build-frontend, build-backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            electron_args: --win --x64
            target_bin: yourant-server.exe
            alt_bin: yourant-server-windows-amd64.exe
          - os: ubuntu-latest
            platform: linux
            electron_args: --linux --x64
            target_bin: yourant-server-linux-amd64
            alt_bin: yourant-server
          - os: macos-latest
            platform: macos
            electron_args: --mac --arm64
            target_bin: yourant-server-darwin-arm64
            alt_bin: yourant-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnss3-dev libxss-dev libasound2-dev

      - name: Download Vite frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download Go backend binaries
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: backend-binaries

      - name: Stage binaries and assets for Electron packaging
        shell: bash
        run: |
          mkdir -p electron/binaries
          mkdir -p electron/resources/bin

          if [ -f "backend-binaries/${{ matrix.target_bin }}" ]; then
            cp "backend-binaries/${{ matrix.target_bin }}" electron/binaries/
            cp "backend-binaries/${{ matrix.target_bin }}" electron/resources/bin/
          fi
          if [ -f "backend-binaries/${{ matrix.alt_bin }}" ]; then
            cp "backend-binaries/${{ matrix.alt_bin }}" electron/binaries/
            cp "backend-binaries/${{ matrix.alt_bin }}" electron/resources/bin/
          fi
          cp -r backend-binaries/* electron/binaries/ 2>/dev/null || true
          chmod -R +x electron/binaries/ 2>/dev/null || true

      - name: Build Electron desktop installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd electron
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npx electron-builder build ${{ matrix.electron_args }}

      - name: Upload Electron desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-dist-${{ matrix.platform }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.yml
            electron/dist/*.blockmap
          if-no-files-found: warn

  release:
    name: Publish GitHub Release Draft
    needs: [version, build-frontend, build-backend, build-electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend archives
        uses: actions/download-artifact@v4
        with:
          name: frontend-archives
          path: release_artifacts

      - name: Download backend binaries
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: release_artifacts

      - name: Download backend archives
        uses: actions/download-artifact@v4
        with:
          name: backend-archives
          path: release_artifacts

      - name: Download Electron desktop artifacts (Windows)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: electron-dist-windows
          path: release_artifacts

      - name: Download Electron desktop artifacts (Linux)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: electron-dist-linux
          path: release_artifacts

      - name: Download Electron desktop artifacts (macOS)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: electron-dist-macos
          path: release_artifacts

      - name: Inspect release assets
        run: |
          echo "Listing gathered release artifacts:"
          ls -la release_artifacts

      - name: Upload Compiled Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Yourant ${{ needs.version.outputs.tag_name }}
          draft: true
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
          files: |
            release_artifacts/yourant-server*
            release_artifacts/yourant-frontend*
            release_artifacts/yourant-desktop*
            release_artifacts/Yourant*
            release_artifacts/*.exe
            release_artifacts/*.AppImage
            release_artifacts/*.deb
            release_artifacts/*.dmg
            release_artifacts/*.zip
            release_artifacts/*.tar.gz
            release_artifacts/*.yml
          body: |
            ## Yourant ${{ needs.version.outputs.tag_name }}

            Automated release build triggered by commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            ### Included Distribution Artifacts
            - **Desktop Executables**: Standalone installers with embedded Go backend sidecar and Vite frontend.
            - **Standalone Server**: Pure Go headless server binaries and archives (Windows, Linux, macOS amd64 & arm64).
            - **Frontend SPA**: Pre-built static assets and distribution archives.
