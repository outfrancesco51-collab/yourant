name: Build Electron App

on:
  workflow_call:
    outputs:
      appVersion:
        description: "The version of the app"
        value: ${{ jobs.build-electron.outputs.app_version }}

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'macos-latest'
            id: 'yourant-desktop-darwin-arm64'
            go_binary_id: 'yourant-server-darwin'
            electron_args: '--mac --arm64'
          - os: 'ubuntu-latest'
            id: 'yourant-desktop-linux-x64'
            go_binary_id: 'yourant-server-linux'
            electron_args: '--linux --x64'
          - os: 'windows-latest'
            id: 'yourant-desktop-windows-x64'
            go_binary_id: 'yourant-server-windows'
            electron_args: '--win --x64'

    runs-on: ${{ matrix.os }}
    outputs:
      app_version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code 📂
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get package version 📦
        id: get-version
        run: |
          NODE_VERSION=$(node -p "try { require('./electron/package.json').version } catch(e) { '1.0.0' }")
          echo "version=$NODE_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install Linux build dependencies 📦
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnss3-dev libxss-dev libasound2-dev

      - name: Download web folder artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: web-denshi
          path: electron/web-denshi

      - name: Ensure binaries folder exists (UNIX)
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        run: mkdir -p ./electron/binaries

      - name: Ensure binaries folder exists (Windows)
        if: matrix.os == 'windows-latest'
        run: mkdir .\electron\binaries

      - name: Download server binaries 📥
        uses: actions/download-artifact@v4
        with:
          name: go-${{ matrix.go_binary_id }}
          path: ./electron/binaries

      - name: Extract server binaries (macOS arm64) 📂
        if: matrix.os == 'macos-latest' && matrix.id == 'yourant-desktop-darwin-arm64'
        run: |
          tar -xf ./electron/binaries/binaries-${{ matrix.go_binary_id }}.tar -C ./electron/binaries
          rm -f ./electron/binaries/binaries-${{ matrix.go_binary_id }}.tar
          chmod -R +x ./electron/binaries 2>/dev/null || true

      - name: Extract server binaries (Linux) 📂
        if: matrix.os == 'ubuntu-latest' && matrix.id == 'yourant-desktop-linux-x64'
        run: |
          tar -xf ./electron/binaries/binaries-${{ matrix.go_binary_id }}.tar -C ./electron/binaries
          rm -f ./electron/binaries/binaries-${{ matrix.go_binary_id }}.tar
          chmod -R +x ./electron/binaries 2>/dev/null || true

      - name: Extract server binaries (Windows) 📂
        if: matrix.os == 'windows-latest'
        run: |
          7z x ".\electron\binaries\binaries-${{ matrix.go_binary_id }}.zip" "-o./electron/binaries/"
          del ".\electron\binaries\binaries-${{ matrix.go_binary_id }}.zip"

      - name: Install and build 📦️
        run: |
          cd electron
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npx electron-builder build ${{ matrix.electron_args }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Electron artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.id }}
          path: |
            ./electron/dist/*.exe
            ./electron/dist/*.AppImage
            ./electron/dist/*.deb
            ./electron/dist/*.dmg
            ./electron/dist/*.zip
            ./electron/dist/*.yml
            ./electron/dist/*.blockmap
          if-no-files-found: warn
